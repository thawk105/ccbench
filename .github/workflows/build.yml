name: build

on:
  push:
    # Run on every branch. (Pull-request runs may double up for same-repo
    # PRs; that's the trade-off for getting CI feedback on topic branches.)
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '.devcontainer/**'
      - '.github/workflows/devcontainer-image.yml'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '.devcontainer/**'
      - '.github/workflows/devcontainer-image.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    # Run the job inside the same devcontainer image developers use locally
    # (Ubuntu base + apt deps + ccache + GCC already installed). This drops
    # the per-run `apt-get install` step and the apt cache that used to wrap
    # it, and guarantees the CI toolchain matches the devcontainer's.
    #
    # --user root: the devcontainer image's default user is vscode (uid=1000),
    # but the GHA runner's work dir (/__w/_temp, bind-mounted into the
    # container) is owned by the runner user on the host. Without root the
    # action's housekeeping writes (e.g. actions/checkout's saveState) hit
    # EACCES. Running as root inside the container is fine — it's isolated.
    container:
      image: ghcr.io/thawk105/ccbench-devcontainer:latest
      options: --user root
    timeout-minutes: 30
    env:
      # Pin ccache dir so actions/cache and ccache agree on the path.
      # (ccache 4+ defaults to ~/.cache/ccache; older docs say ~/.ccache.)
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      # actions/checkout writes its own safe.directory, but later steps
      # invoke git from a fresh shell (`sh -e {0}`) where that scoped
      # config is not always picked up. Set it once globally so every
      # `git ...` call in this job — checkout's submodule walk, the
      # bootstrap-key step, etc. — sees the workspace as safe.
      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # ccache deduplicates compilations across the 34 binaries (each
      # protocol's CMakeLists.txt currently compiles common/*.cc and its
      # own .cc files separately for every target).
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Configure ccache
        run: |
          ccache --max-size=400M
          ccache --zero-stats

      # Cache key invalidates when any submodule SHA or bootstrap script changes.
      - name: Compute bootstrap cache key
        id: bootstrap-key
        run: |
          git submodule status > .submodule-state
          echo "hash=$(sha256sum .submodule-state build_tools/bootstrap*.sh | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore third_party build cache
        id: tp-cache
        uses: actions/cache@v4
        with:
          path: |
            third_party/masstree/lib*.a
            third_party/masstree/config.h
            third_party/masstree/config.status
            third_party/mimalloc/out
            third_party/googletest/build
          key: tp-${{ runner.os }}-${{ steps.bootstrap-key.outputs.hash }}

      - name: Build third-party (masstree)
        if: steps.tp-cache.outputs.cache-hit != 'true'
        run: ./build_tools/bootstrap.sh

      - name: Build third-party (mimalloc)
        if: steps.tp-cache.outputs.cache-hit != 'true'
        run: ./build_tools/bootstrap_mimalloc.sh

      - name: Build third-party (googletest)
        if: steps.tp-cache.outputs.cache-hit != 'true'
        run: ./build_tools/bootstrap_googletest.sh

      - name: Configure (top-level cmake)
        # Sanitizer adds significant link-time memory/cpu cost and CI does
        # not run binaries, so it adds no value here. Use Release for the
        # build verification. Wire ccache via compiler launchers.
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_SANITIZER=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build all protocols
        # Release without sanitizer is light enough to use full runner
        # parallelism. (Debug+ASan needed -j2 to avoid OOM, but we no
        # longer build that here.)
        run: cmake --build build -j $(nproc)

      - name: ccache stats
        if: always()
        run: ccache --show-stats
